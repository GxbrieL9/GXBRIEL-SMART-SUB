name: Update Universal Subscriptions

on:
  schedule:
    # Run every 30 minutes at minute 17 and 47
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      speed_test_limit:
        description: 'Maximum candidate nodes to test speed (0 for unlimited)'
        required: false
        default: '200'
        type: string
      preferred_speed:
        description: 'Preferred speed threshold in Mbps (24 Mbps = 3 MB/s)'
        required: false
        default: '24.0'
        type: string
      max_output_nodes:
        description: 'Maximum final nodes in subscription'
        required: false
        default: '200'
        type: string

concurrency:
  group: update-subscriptions
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Test & Publish Subscriptions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Resolve latest Mihomo release
        id: mihomo-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - << 'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest",
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "GXBRIEL-SMART-SUB-Builder/1.0",
                  "Authorization": f"Bearer {os.environ.get('GH_TOKEN', '')}",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as resp:
                  version = json.load(resp).get("tag_name", "latest")
          except Exception as e:
              print(f"Notice: Could not query latest Mihomo release: {e}")
              version = "latest"
          print(f"Using Mihomo release: {version}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")
          PY

      - name: Cache Mihomo binary
        id: cache-mihomo
        uses: actions/cache@v4
        with:
          path: .cache/mihomo
          key: mihomo-${{ runner.os }}-${{ runner.arch }}-${{ steps.mihomo-release.outputs.version }}

      - name: Install Mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/mihomo .bin
          if [ ! -f .cache/mihomo/mihomo ]; then
            python scripts/install_mihomo.py --output .cache/mihomo/mihomo
          fi
          cp .cache/mihomo/mihomo .bin/mihomo
          chmod +x .bin/mihomo
          .bin/mihomo -v

      - name: Cache Hiddify Core
        id: cache-hiddify
        uses: actions/cache@v4
        with:
          path: .cache/hiddify
          key: hiddify-core-v5.5.5-linux-amd64-r1

      - name: Install Hiddify Core
        run: |
          mkdir -p .cache/hiddify .bin
          if [ ! -x .cache/hiddify/hiddify-core ]; then
            curl --fail --location --retry 2 \
              https://github.com/hiddify/hiddify-core/releases/download/v5.5.5/hiddify-core-linux-amd64.tar.gz \
              --output .cache/hiddify/hiddify-core.tar.gz
            tar -xzf .cache/hiddify/hiddify-core.tar.gz --strip-components=1 -C .cache/hiddify
          fi
          cp .cache/hiddify/hiddify-core .bin/hiddify-core
          chmod +x .bin/hiddify-core
          .bin/hiddify-core version --disable-color

      - name: Run benchmark & generate subscriptions
        id: benchmark
        env:
          SOURCE_URLS: ${{ secrets.SOURCE_URLS }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          MAX_RUNTIME_SECONDS: "210"
          SOURCE_TIMEOUT_SECONDS: "12"
          SOURCE_RETRIES: "1"
          FETCH_WORKERS: "8"
          TCP_PREFILTER_ENABLED: "1"
          TCP_CONNECT_TIMEOUT_SECONDS: "1"
          TCP_PREFILTER_WORKERS: "64"
          ALIYUN_FC_ENABLED: "0"
          MAX_LATENCY_MS: "3000"
          LATENCY_TIMEOUT_MS: "2000"
          LATENCY_TEST_ATTEMPTS: "1"
          BENCHMARK_WORKERS: "64"
          GEOIP_WORKERS: "24"
          SPEED_TEST_ENABLED: "1"
          SPEED_TEST_LIMIT: ${{ inputs.speed_test_limit || '200' }}
          SPEED_TEST_URL: "https://speed.cloudflare.com/__down?bytes=524288"
          SPEED_TEST_BYTES: "524288"
          SPEED_TIMEOUT_SECONDS: "3"
          PREFERRED_SPEED_MBPS: ${{ inputs.preferred_speed || '24.0' }}
          FAST_SPEED_MBPS: "24.0"
          GOOD_SPEED_MBPS: "12.0"
          BACKUP_SPEED_MBPS: "5.0"
          MIN_SPEED_MBPS: "12.0"
          SPEED_FALLBACK_ENABLED: "1"
          SPEED_FALLBACK_MIN_MBPS: "5.0"
          MAX_OUTPUT_NODES: ${{ inputs.max_output_nodes || '200' }}
        run: |
          subbench run --mihomo .bin/mihomo --output public --workdir .work

      - name: Publish all subscription formats to Secret Gist
        id: publish-gist
        run: |
          python scripts/validate_hiddify.py \
            --cli .bin/hiddify-core \
            --subscription public/subscription.txt \
            --clash public/clash.yaml \
            --singbox public/singbox.json \
            --output-dir .work/hiddify-check \
            --probe
          python publish_gist.py \
            --subscription public/subscription.txt \
            --clash public/clash.yaml \
            --singbox public/singbox.json \
            --raw-subscription public/subscription-raw.txt \
            --report public/report.json
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ vars.GIST_ID }}

      - name: Summary report
        if: always()
        env:
          GIST_ID: ${{ vars.GIST_ID }}
        run: |
          python scripts/summary.py
