name: Update Karing subscription

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: subscription-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_URLS: ${{ secrets.SOURCE_URLS }}
      GIST_ID: ${{ vars.GIST_ID }}
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      SPEED_TEST_ENABLED: "1"
      MIN_SPEED_MBPS: "24"
      MAX_OUTPUT_NODES: "200"
      MAX_NODES: "800"
      SPEED_TEST_LIMIT: "300"
      SPEED_TEST_BYTES: "1048576"
      SPEED_TIMEOUT_SECONDS: "10"
      BENCHMARK_WORKERS: "24"
      TCP_PREFILTER_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install .

      - name: Install Mihomo
        run: python scripts/install_mihomo.py --output .bin/mihomo

      - name: Build and benchmark subscription
        run: >-
          python -m subbench run
          --mihomo .bin/mihomo
          --output public
          --workdir .work

      - name: Publish subscription.txt to Secret Gist
        run: python publish_gist.py --raw public/v2ray-raw.txt
