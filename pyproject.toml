[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gxbriel-smart-sub"
version = "0.1.0"
description = "GXBRIEL SMART SUB — Automated VPN proxy aggregator and speed benchmarker for Karing"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2,<7",
  "requests>=2.32,<3",
]

[project.scripts]
subbench = "subbench.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.setuptools.packages.find]
where = ["src"]
